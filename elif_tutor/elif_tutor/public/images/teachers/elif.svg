<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 280" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="elif-bg" cx="50%" cy="42%" r="58%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="55%" stop-color="#fdf2f8"/>
      <stop offset="100%" stop-color="#f5d0e3"/>
    </radialGradient>
    <linearGradient id="elif-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f472b6"/>
      <stop offset="50%" stop-color="#831843"/>
      <stop offset="100%" stop-color="#4a0e2e"/>
    </linearGradient>
    <!-- Skin Shading -->
    <linearGradient id="elif-skin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff1e8"/>
      <stop offset="60%" stop-color="#fde4d4"/>
      <stop offset="100%" stop-color="#f8cfbb"/>
    </linearGradient>
    <linearGradient id="elif-neck-shadow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e8b19a"/>
      <stop offset="100%" stop-color="#fcd8c7"/>
    </linearGradient>
    <!-- Hair Gradients -->
    <linearGradient id="elif-hair-back" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2d131e"/>
      <stop offset="60%" stop-color="#1d0a13"/>
      <stop offset="100%" stop-color="#13050b"/>
    </linearGradient>
    <linearGradient id="elif-hair-front" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4c2134"/>
      <stop offset="35%" stop-color="#341423"/>
      <stop offset="100%" stop-color="#190710"/>
    </linearGradient>
    <linearGradient id="elif-hair-shine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#833d5f" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#341423" stop-opacity="0"/>
    </linearGradient>
    <!-- Outfit Gradients -->
    <linearGradient id="elif-blazer" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67113e"/>
      <stop offset="50%" stop-color="#4a0e2e"/>
      <stop offset="100%" stop-color="#2f061b"/>
    </linearGradient>
    <linearGradient id="elif-blazer-lapel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7e174e"/>
      <stop offset="100%" stop-color="#420a27"/>
    </linearGradient>
    <!-- Soft Drop Shadow Filter -->
    <filter id="soft-shadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#4a0e2e" flood-opacity="0.16"/>
    </filter>
  </defs>

  <!-- Background Circle & Subtle Outer Ring -->
  <circle cx="140" cy="140" r="132" fill="url(#elif-bg)"/>
  <circle cx="140" cy="140" r="132" fill="none" stroke="url(#elif-border)" stroke-width="4" opacity="0.45"/>
  <circle cx="140" cy="140" r="126" fill="none" stroke="#be185d" stroke-width="1.2" stroke-dasharray="4 6" opacity="0.3"/>

  <!-- Background Decor Sparkles -->
  <path d="M54 78 Q54 62 46 58 Q54 54 58 46 Q62 54 70 58 Q62 62 58 78 Z" fill="#f472b6" opacity="0.45"/>
  <path d="M228 92 Q228 80 220 76 Q228 72 232 64 Q236 72 244 76 Q236 80 232 92 Z" fill="#be185d" opacity="0.35"/>
  <circle cx="68" cy="192" r="3.5" fill="#f43f5e" opacity="0.25"/>
  <circle cx="218" cy="180" r="4" fill="#be185d" opacity="0.25"/>

  <!-- Back Hair Waves (Rich, Flowing Volume) -->
  <g id="back-hair" filter="url(#soft-shadow)">
    <path d="M78 132 C70 78 88 44 140 44 C192 44 210 78 202 132 C206 172 196 210 186 230 C172 216 166 195 166 182 L114 182 C114 195 108 216 94 230 C84 210 74 172 78 132 Z" fill="url(#elif-hair-back)"/>
    <!-- Left & Right Flowing Locks -->
    <path d="M76 130 C72 165 80 205 98 226 C90 205 84 175 84 142 Z" fill="#200a14" opacity="0.6"/>
    <path d="M204 130 C208 165 200 205 182 226 C190 205 196 175 196 142 Z" fill="#200a14" opacity="0.6"/>
  </g>

  <!-- Shoulders & Outfit (Burgundy Blazer + Blouse) -->
  <g id="body" filter="url(#soft-shadow)">
    <!-- Base Body/Blazer -->
    <path d="M56 280 C60 222 92 196 122 188 L140 208 L158 188 C188 196 220 222 224 280 Z" fill="url(#elif-blazer)"/>
    <!-- Inner Silk Blouse (Cream) -->
    <path d="M118 188 L140 220 L162 188 L140 174 Z" fill="#fffaf5"/>
    <path d="M136 192 L140 220 L144 192 Z" fill="#f5ebe0" opacity="0.8"/>
    <!-- Blazer Left Lapel -->
    <path d="M88 280 C92 232 108 202 124 188 L140 222 L116 280 Z" fill="url(#elif-blazer-lapel)"/>
    <!-- Blazer Right Lapel -->
    <path d="M192 280 C188 232 172 202 156 188 L140 222 L164 280 Z" fill="url(#elif-blazer-lapel)"/>
    <!-- Gold Feather Quill Pin on Left Lapel (Brand Badge) -->
    <path d="M112 216 C110 206 114 196 124 188 C123 198 120 208 114 216 Z" fill="#f59e0b"/>
    <circle cx="114" cy="216" r="1.5" fill="#d97706"/>
  </g>

  <!-- Neck & Shadow -->
  <path d="M126 156 L126 188 C132 194 148 194 154 188 L154 156 Z" fill="url(#elif-neck-shadow)"/>
  <ellipse cx="140" cy="184" rx="14" ry="4" fill="#e8a892" opacity="0.5"/>

  <!-- Head Base -->
  <g id="head" filter="url(#soft-shadow)">
    <!-- Head Contour -->
    <path d="M96 124 C94 88 108 68 140 68 C172 68 186 88 184 124 C184 154 168 178 140 178 C112 178 96 154 96 124 Z" fill="url(#elif-skin)"/>
    <!-- Subtle Chin Shading -->
    <path d="M128 172 Q140 178 152 172 Q140 174 128 172" fill="#e8a994" opacity="0.4"/>
  </g>

  <!-- Ears & Delicate Pearl Earrings -->
  <ellipse cx="94" cy="128" rx="5" ry="9" fill="#fcd0bd"/>
  <ellipse cx="94" cy="128" rx="3" ry="5" fill="#f3af96"/>
  <circle cx="94" cy="136" r="3" fill="#fef08a" stroke="#d97706" stroke-width="0.8"/>

  <ellipse cx="186" cy="128" rx="5" ry="9" fill="#fcd0bd"/>
  <ellipse cx="186" cy="128" rx="3" ry="5" fill="#f3af96"/>
  <circle cx="186" cy="136" r="3" fill="#fef08a" stroke="#d97706" stroke-width="0.8"/>

  <!-- Face Details -->
  <!-- Cute Rose Cheeks -->
  <ellipse cx="110" cy="138" rx="9" ry="5.5" fill="#f43f5e" opacity="0.22"/>
  <ellipse cx="170" cy="138" rx="9" ry="5.5" fill="#f43f5e" opacity="0.22"/>

  <!-- Expressive Eyebrows -->
  <path d="M106 108 Q118 103 128 107" stroke="#361221" stroke-width="3" stroke-linecap="round" fill="none"/>
  <path d="M152 107 Q162 103 174 108" stroke="#361221" stroke-width="3" stroke-linecap="round" fill="none"/>

  <!-- Big Warm Expressive Eyes -->
  <g id="eyes">
    <!-- Eye Left -->
    <ellipse cx="118" cy="122" rx="9.5" ry="10" fill="#ffffff"/>
    <ellipse cx="118" cy="122" rx="7.5" ry="8.5" fill="#3b1122"/>
    <circle cx="118" cy="121" r="5" fill="#18040d"/>
    <circle cx="115.5" cy="118.5" r="2.8" fill="#ffffff"/>
    <circle cx="120" cy="124" r="1.3" fill="#ffffff"/>
    <path d="M108 116 Q118 112 128 116" stroke="#250915" stroke-width="2.6" fill="none" stroke-linecap="round"/>
    <path d="M128 116 L131 113" stroke="#250915" stroke-width="1.8" stroke-linecap="round"/>

    <!-- Eye Right -->
    <ellipse cx="162" cy="122" rx="9.5" ry="10" fill="#ffffff"/>
    <ellipse cx="162" cy="122" rx="7.5" ry="8.5" fill="#3b1122"/>
    <circle cx="162" cy="121" r="5" fill="#18040d"/>
    <circle cx="159.5" cy="118.5" r="2.8" fill="#ffffff"/>
    <circle cx="164" cy="124" r="1.3" fill="#ffffff"/>
    <path d="M152 116 Q162 112 172 116" stroke="#250915" stroke-width="2.6" fill="none" stroke-linecap="round"/>
    <path d="M172 116 L175 113" stroke="#250915" stroke-width="1.8" stroke-linecap="round"/>
  </g>

  <!-- Elegant Glasses (Slim Burgundy & Rose Gold) -->
  <g id="glasses">
    <rect x="102" y="110" width="32" height="23" rx="8" fill="rgba(255,255,255,0.18)" stroke="#4a0e2e" stroke-width="2.8"/>
    <rect x="146" y="110" width="32" height="23" rx="8" fill="rgba(255,255,255,0.18)" stroke="#4a0e2e" stroke-width="2.8"/>
    <path d="M134 118 Q140 115 146 118" stroke="#4a0e2e" stroke-width="2.8" fill="none"/>
    <path d="M96 116 L102 118" stroke="#4a0e2e" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M178 118 L184 116" stroke="#4a0e2e" stroke-width="2.2" stroke-linecap="round"/>
    <!-- Glass Glare Reflection -->
    <path d="M106 114 L114 114" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.8"/>
    <path d="M150 114 L158 114" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.8"/>
  </g>

  <!-- Nose -->
  <path d="M138 128 Q140 135 144 134" stroke="#df957b" stroke-width="2.4" stroke-linecap="round" fill="none"/>

  <!-- Warm Caring Smile -->
  <g id="smile">
    <path d="M125 148 Q140 164 155 148" fill="#be185d"/>
    <path d="M127 149 Q140 156 153 149" fill="#ffffff"/>
    <path d="M123 147 Q140 166 157 147" stroke="#831843" stroke-width="2.4" fill="none" stroke-linecap="round"/>
    <path d="M122 147 Q120 144 122 143" stroke="#831843" stroke-width="1.8" fill="none" stroke-linecap="round"/>
    <path d="M158 147 Q160 144 158 143" stroke="#831843" stroke-width="1.8" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Front Hair Styling (Side Swept Bangs & Glossy Strands) -->
  <g id="front-hair">
    <!-- Bangs Base -->
    <path d="M94 112 C96 74 122 62 144 62 C168 62 186 74 186 110 C178 84 156 82 140 82 C120 82 104 88 94 112 Z" fill="url(#elif-hair-front)"/>
    <!-- Glossy Highlight Arch -->
    <path d="M112 72 Q140 65 168 72" stroke="url(#elif-hair-shine)" stroke-width="6" fill="none" stroke-linecap="round"/>
    <!-- Side Hair Framing Cheek Left -->
    <path d="M96 106 C92 130 94 156 104 168 C102 148 100 126 106 104 Z" fill="url(#elif-hair-front)"/>
    <!-- Side Hair Framing Cheek Right -->
    <path d="M184 106 C188 130 186 156 176 168 C178 148 180 126 174 104 Z" fill="url(#elif-hair-front)"/>
    <!-- Elegant Swept Forehead Strand -->
    <path d="M120 70 Q138 88 152 86 Q134 80 124 68 Z" fill="#4c2134"/>
  </g>
</svg>