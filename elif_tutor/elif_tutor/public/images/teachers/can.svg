<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 280" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="can-bg" cx="50%" cy="42%" r="58%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="55%" stop-color="#ecfdf5"/>
      <stop offset="100%" stop-color="#a7f3d0"/>
    </radialGradient>
    <linearGradient id="can-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="50%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>
    <!-- Skin Shading -->
    <linearGradient id="can-skin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff3eb"/>
      <stop offset="60%" stop-color="#fde4d4"/>
      <stop offset="100%" stop-color="#f5caa6"/>
    </linearGradient>
    <linearGradient id="can-neck-shadow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e0a37c"/>
      <stop offset="100%" stop-color="#f5caa6"/>
    </linearGradient>
    <!-- Hair Gradients -->
    <linearGradient id="can-hair" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3f2316"/>
      <stop offset="50%" stop-color="#26130b"/>
      <stop offset="100%" stop-color="#140905"/>
    </linearGradient>
    <linearGradient id="can-hair-shine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7c4a32" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#26130b" stop-opacity="0"/>
    </linearGradient>
    <!-- Outfit Gradients -->
    <linearGradient id="can-jacket" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="50%" stop-color="#047857"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>
    <linearGradient id="can-jacket-collar" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#065f46"/>
    </linearGradient>
    <!-- Soft Drop Shadow Filter -->
    <filter id="soft-shadow-can" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#064e3b" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Background Circle & Subtle Outer Ring -->
  <circle cx="140" cy="140" r="132" fill="url(#can-bg)"/>
  <circle cx="140" cy="140" r="132" fill="none" stroke="url(#can-border)" stroke-width="4" opacity="0.45"/>
  <circle cx="140" cy="140" r="126" fill="none" stroke="#059669" stroke-width="1.2" stroke-dasharray="4 6" opacity="0.3"/>

  <!-- Background Coaching Accents -->
  <path d="M48 80 L58 90 L74 72" stroke="#10b981" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.45"/>
  <path d="M224 82 L234 72 L244 82" stroke="#059669" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.45"/>
  <circle cx="64" cy="190" r="3.5" fill="#34d399" opacity="0.3"/>
  <circle cx="220" cy="180" r="4" fill="#047857" opacity="0.3"/>

  <!-- Back Hair Silhouette -->
  <g id="back-hair" filter="url(#soft-shadow-can)">
    <path d="M92 110 C90 60 190 60 188 110 C190 145 186 160 180 172 L100 172 C94 160 90 145 92 110 Z" fill="url(#can-hair)"/>
  </g>

  <!-- Shoulders & Outfit (Forest Green Bomber / Varsity Jacket) -->
  <g id="body" filter="url(#soft-shadow-can)">
    <path d="M54 280 C58 220 90 196 122 188 L140 210 L158 188 C190 196 222 220 226 280 Z" fill="url(#can-jacket)"/>
    <!-- Inner White Athletic T-Shirt -->
    <path d="M120 188 L140 216 L160 188 L140 174 Z" fill="#ffffff"/>
    <path d="M126 190 L140 204 L154 190 Z" fill="#e2e8f0"/>
    <!-- Varsity Jacket Collar & Zipper Trim -->
    <path d="M102 280 C106 226 122 198 132 188 L140 210 L126 280 Z" fill="url(#can-jacket-collar)"/>
    <path d="M178 280 C174 226 158 198 148 188 L140 210 L154 280 Z" fill="url(#can-jacket-collar)"/>
    <!-- Zipper Line -->
    <line x1="140" y1="210" x2="140" y2="280" stroke="#f8fafc" stroke-width="2.5"/>
    <!-- Cool Coach Pin / Badge -->
    <circle cx="106" cy="226" r="6" fill="#10b981"/>
    <path d="M103 226 L105 228 L109 224" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

  <!-- Neck & Shadow -->
  <path d="M124 156 L124 188 C132 194 148 194 156 188 L156 156 Z" fill="url(#can-neck-shadow)"/>
  <ellipse cx="140" cy="184" rx="15" ry="4" fill="#d9996e" opacity="0.45"/>

  <!-- Head Base -->
  <g id="head" filter="url(#soft-shadow-can)">
    <path d="M96 122 C94 86 108 68 140 68 C172 68 186 86 184 122 C184 154 168 178 140 178 C112 178 96 154 96 122 Z" fill="url(#can-skin)"/>
    <path d="M126 172 Q140 178 154 172" stroke="#d58f60" stroke-width="2" fill="none" opacity="0.35"/>
  </g>

  <!-- Ears -->
  <ellipse cx="94" cy="126" rx="5" ry="9" fill="#fcd0bd"/>
  <ellipse cx="94" cy="126" rx="3" ry="5" fill="#f3af96"/>
  <ellipse cx="186" cy="126" rx="5" ry="9" fill="#fcd0bd"/>
  <ellipse cx="186" cy="126" rx="3" ry="5" fill="#f3af96"/>

  <!-- Face Details -->
  <!-- Modern Confident Eyebrows -->
  <path d="M106 104 Q118 99 128 103" stroke="#26130b" stroke-width="3.6" stroke-linecap="round" fill="none"/>
  <path d="M152 103 Q162 99 174 104" stroke="#26130b" stroke-width="3.6" stroke-linecap="round" fill="none"/>

  <!-- Lively Energetic Eyes -->
  <g id="eyes">
    <ellipse cx="118" cy="119" rx="9" ry="9.5" fill="#ffffff"/>
    <ellipse cx="118" cy="119" rx="7" ry="8" fill="#1b2a22"/>
    <circle cx="118" cy="118" r="4.5" fill="#06120b"/>
    <circle cx="115.5" cy="116" r="2.6" fill="#ffffff"/>
    <circle cx="120" cy="121" r="1.2" fill="#ffffff"/>
    <path d="M108 113 Q118 110 128 113" stroke="#06120b" stroke-width="2.5" fill="none" stroke-linecap="round"/>

    <ellipse cx="162" cy="119" rx="9" ry="9.5" fill="#ffffff"/>
    <ellipse cx="162" cy="119" rx="7" ry="8" fill="#1b2a22"/>
    <circle cx="162" cy="118" r="4.5" fill="#06120b"/>
    <circle cx="159.5" cy="116" r="2.6" fill="#ffffff"/>
    <circle cx="164" cy="121" r="1.2" fill="#ffffff"/>
    <path d="M152 113 Q162 110 172 113" stroke="#06120b" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Nose -->
  <path d="M138 125 Q140 133 145 132" stroke="#d58f60" stroke-width="2.4" stroke-linecap="round" fill="none"/>

  <!-- Confident Friendly Grin -->
  <g id="smile">
    <path d="M124 146 Q140 166 156 146" fill="#065f46"/>
    <path d="M126 147 Q140 156 154 147" fill="#ffffff"/>
    <path d="M122 145 Q140 168 158 145" stroke="#064e3b" stroke-width="2.4" fill="none" stroke-linecap="round"/>
    <path d="M121 144 Q119 141 121 140" stroke="#064e3b" stroke-width="1.8" fill="none" stroke-linecap="round"/>
    <path d="M159 144 Q161 141 159 140" stroke="#064e3b" stroke-width="1.8" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Front Haircut (Trendy Textured Crop / Flow Cut) -->
  <g id="front-hair">
    <path d="M92 106 C92 56 114 44 140 44 C168 44 188 56 188 104 C180 82 162 72 140 72 C118 72 102 82 92 106 Z" fill="url(#can-hair)"/>
    <path d="M110 52 Q140 44 168 52" stroke="url(#can-hair-shine)" stroke-width="5" fill="none" stroke-linecap="round"/>
    <!-- Modern Textured Tuft -->
    <path d="M124 46 Q138 36 152 48 Q140 44 124 46 Z" fill="url(#can-hair)"/>
    <path d="M136 42 Q148 34 158 44 Q148 40 136 42 Z" fill="#7c4a32"/>
    <path d="M94 102 C94 114 96 126 98 134 C98 120 96 110 94 102 Z" fill="url(#can-hair)"/>
    <path d="M186 102 C186 114 184 126 182 134 C182 120 184 110 186 102 Z" fill="url(#can-hair)"/>
  </g>
</svg>
