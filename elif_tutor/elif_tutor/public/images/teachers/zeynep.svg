<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 280" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="zeynep-bg" cx="50%" cy="42%" r="58%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="55%" stop-color="#fff7ed"/>
      <stop offset="100%" stop-color="#fed7aa"/>
    </radialGradient>
    <linearGradient id="zeynep-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="50%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#9a3412"/>
    </linearGradient>
    <!-- Skin Shading -->
    <linearGradient id="zeynep-skin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff4ed"/>
      <stop offset="60%" stop-color="#fde5d6"/>
      <stop offset="100%" stop-color="#f7ceb2"/>
    </linearGradient>
    <linearGradient id="zeynep-neck-shadow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e2a882"/>
      <stop offset="100%" stop-color="#f7ceb2"/>
    </linearGradient>
    <!-- Hair Gradients -->
    <linearGradient id="zeynep-hair" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60290a"/>
      <stop offset="50%" stop-color="#431407"/>
      <stop offset="100%" stop-color="#240a04"/>
    </linearGradient>
    <linearGradient id="zeynep-hair-shine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#b45309" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#431407" stop-opacity="0"/>
    </linearGradient>
    <!-- Outfit Gradients -->
    <linearGradient id="zeynep-sweater" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="50%" stop-color="#c2410c"/>
      <stop offset="100%" stop-color="#7c2d12"/>
    </linearGradient>
    <!-- Soft Drop Shadow Filter -->
    <filter id="soft-shadow-zeynep" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#9a3412" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Background Circle & Subtle Outer Ring -->
  <circle cx="140" cy="140" r="132" fill="url(#zeynep-bg)"/>
  <circle cx="140" cy="140" r="132" fill="none" stroke="url(#zeynep-border)" stroke-width="4" opacity="0.45"/>
  <circle cx="140" cy="140" r="126" fill="none" stroke="#ea580c" stroke-width="1.2" stroke-dasharray="4 6" opacity="0.3"/>

  <!-- Background Sparkles -->
  <path d="M52 74 Q52 60 44 56 Q52 52 56 44 Q60 52 68 56 Q60 60 56 74 Z" fill="#f97316" opacity="0.4"/>
  <path d="M228 88 Q228 76 220 72 Q228 68 232 60 Q236 68 244 72 Q236 76 232 88 Z" fill="#ea580c" opacity="0.4"/>
  <circle cx="66" cy="190" r="3.5" fill="#f59e0b" opacity="0.3"/>
  <circle cx="218" cy="180" r="4" fill="#ea580c" opacity="0.3"/>

  <!-- Topknot / High Ponytail Bun -->
  <g id="top-bun" filter="url(#soft-shadow-zeynep)">
    <circle cx="140" cy="48" r="22" fill="url(#zeynep-hair)"/>
    <ellipse cx="140" cy="62" rx="12" ry="5" fill="#f97316"/>
    <path d="M128 42 Q140 34 152 42" stroke="#b45309" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Back Hair Waves -->
  <g id="back-hair" filter="url(#soft-shadow-zeynep)">
    <path d="M78 126 C72 74 90 52 140 52 C190 52 208 74 202 126 C206 166 198 206 186 226 C172 212 166 192 166 180 L114 180 C114 192 108 212 94 226 C82 206 74 166 78 126 Z" fill="url(#zeynep-hair)"/>
  </g>

  <!-- Shoulders & Outfit (Terracotta Knit Sweater + White Collar) -->
  <g id="body" filter="url(#soft-shadow-zeynep)">
    <path d="M54 280 C58 220 90 196 122 188 L140 208 L158 188 C190 196 222 220 226 280 Z" fill="url(#zeynep-sweater)"/>
    <!-- Scalloped Peter Pan White Collar -->
    <path d="M122 188 C128 202 138 202 140 190 C142 202 152 202 158 188 L140 174 Z" fill="#ffffff"/>
    <path d="M124 188 Q132 198 139 190" stroke="#fed7aa" stroke-width="1.5" fill="none"/>
    <path d="M141 190 Q148 198 156 188" stroke="#fed7aa" stroke-width="1.5" fill="none"/>
    <!-- Cute Star Motivation Pin -->
    <path d="M106 220 L108 226 L114 226 L109 230 L111 236 L106 232 L101 236 L103 230 L98 226 L104 226 Z" fill="#facc15"/>
  </g>

  <!-- Neck & Shadow -->
  <path d="M126 156 L126 186 C132 192 148 192 154 186 L154 156 Z" fill="url(#zeynep-neck-shadow)"/>
  <ellipse cx="140" cy="182" rx="14" ry="4" fill="#d9996e" opacity="0.45"/>

  <!-- Head Base -->
  <g id="head" filter="url(#soft-shadow-zeynep)">
    <path d="M96 122 C94 86 108 68 140 68 C172 68 186 86 184 122 C184 154 168 178 140 178 C112 178 96 154 96 122 Z" fill="url(#zeynep-skin)"/>
  </g>

  <!-- Ears & Star Studs -->
  <ellipse cx="94" cy="126" rx="5" ry="9" fill="#fcd0bd"/>
  <ellipse cx="94" cy="126" rx="3" ry="5" fill="#f3af96"/>
  <circle cx="94" cy="134" r="2.8" fill="#facc15" stroke="#ca8a04" stroke-width="0.8"/>

  <ellipse cx="186" cy="126" rx="5" ry="9" fill="#fcd0bd"/>
  <ellipse cx="186" cy="126" rx="3" ry="5" fill="#f3af96"/>
  <circle cx="186" cy="134" r="2.8" fill="#facc15" stroke="#ca8a04" stroke-width="0.8"/>

  <!-- Cheerful Warm Blush -->
  <ellipse cx="110" cy="138" rx="10" ry="6" fill="#f97316" opacity="0.24"/>
  <ellipse cx="170" cy="138" rx="10" ry="6" fill="#f97316" opacity="0.24"/>

  <!-- Expressive Eyebrows -->
  <path d="M106 106 Q118 100 128 104" stroke="#431407" stroke-width="3" stroke-linecap="round" fill="none"/>
  <path d="M152 104 Q162 100 174 106" stroke="#431407" stroke-width="3" stroke-linecap="round" fill="none"/>

  <!-- Radiant Joyful Eyes -->
  <g id="eyes">
    <ellipse cx="118" cy="120" rx="9.5" ry="10" fill="#ffffff"/>
    <ellipse cx="118" cy="120" rx="7.5" ry="8.5" fill="#451a03"/>
    <circle cx="118" cy="119" r="5" fill="#1c0b02"/>
    <circle cx="115.5" cy="116.5" r="2.8" fill="#ffffff"/>
    <circle cx="120" cy="122" r="1.3" fill="#ffffff"/>
    <path d="M108 114 Q118 110 128 114" stroke="#240a04" stroke-width="2.6" fill="none" stroke-linecap="round"/>
    <path d="M128 114 L131 111" stroke="#240a04" stroke-width="1.8" stroke-linecap="round"/>

    <ellipse cx="162" cy="120" rx="9.5" ry="10" fill="#ffffff"/>
    <ellipse cx="162" cy="120" rx="7.5" ry="8.5" fill="#451a03"/>
    <circle cx="162" cy="119" r="5" fill="#1c0b02"/>
    <circle cx="159.5" cy="116.5" r="2.8" fill="#ffffff"/>
    <circle cx="164" cy="122" r="1.3" fill="#ffffff"/>
    <path d="M152 114 Q162 110 172 114" stroke="#240a04" stroke-width="2.6" fill="none" stroke-linecap="round"/>
    <path d="M172 114 L175 111" stroke="#240a04" stroke-width="1.8" stroke-linecap="round"/>
  </g>

  <!-- Nose -->
  <path d="M138 126 Q140 133 144 132" stroke="#d58f60" stroke-width="2.4" stroke-linecap="round" fill="none"/>

  <!-- Big Enthusiastic Smile (Bright & Encouraging) -->
  <g id="smile">
    <path d="M124 146 Q140 166 156 146" fill="#c2410c"/>
    <path d="M126 147 Q140 156 154 147" fill="#ffffff"/>
    <path d="M122 145 Q140 168 158 145" stroke="#7c2d12" stroke-width="2.4" fill="none" stroke-linecap="round"/>
    <path d="M121 144 Q119 141 121 140" stroke="#7c2d12" stroke-width="1.8" fill="none" stroke-linecap="round"/>
    <path d="M159 144 Q161 141 159 140" stroke="#7c2d12" stroke-width="1.8" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Front Hair Strands (Dynamic Bangs & Tendrils) -->
  <g id="front-hair">
    <path d="M94 110 C96 72 122 62 144 62 C168 62 186 72 186 108 C178 84 156 82 140 82 C120 82 104 88 94 110 Z" fill="url(#zeynep-hair)"/>
    <path d="M112 70 Q140 64 168 70" stroke="url(#zeynep-hair-shine)" stroke-width="5" fill="none" stroke-linecap="round"/>
    <!-- Framing Lock Left -->
    <path d="M96 106 C92 132 94 158 102 168 C100 148 98 126 104 104 Z" fill="url(#zeynep-hair)"/>
    <!-- Framing Lock Right -->
    <path d="M184 106 C188 132 186 158 178 168 C180 148 182 126 176 104 Z" fill="url(#zeynep-hair)"/>
  </g>
</svg>