<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Elif Öğretmen — Giriş</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --cream-bg: #fbf6ee;
      --plum: #4a0e2e;
      --plum-deep: #350820;
      --plum-soft: rgba(74, 14, 46, 0.16);
      --plum-muted: rgba(74, 14, 46, 0.65);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 20px 64px;
      color: var(--plum);
      background-color: var(--cream-bg);
      background-image: url("/assets/elif_tutor/images/login_bg.jpg");
      background-size: cover;
      background-position: center bottom;
      background-repeat: no-repeat;
    }

    .hero-wrap {
      width: 100%;
      max-width: 400px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .ed-headline {
      font-family: "Anton", sans-serif;
      font-size: clamp(2.9rem, 7vw, 4.6rem);
      line-height: 0.96;
      letter-spacing: 0.02em;
      text-transform: uppercase;
      color: var(--plum);
      margin-bottom: 24px;
      text-shadow: 0 2px 18px rgba(251, 246, 238, 0.9);
    }

    .login-card {
      width: 100%;
      background: rgba(255, 253, 249, 0.88);
      border: 1.5px solid var(--plum-soft);
      border-radius: 20px;
      padding: 26px 26px 22px;
      text-align: left;
      box-shadow: 0 24px 55px -26px rgba(74, 14, 46, 0.25);
      backdrop-filter: blur(10px);
    }

    .field-group { margin-bottom: 14px; }
    .field-group label {
      display: block;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--plum);
      margin-bottom: 6px;
    }
    .field-wrap { position: relative; }
    .field-group input {
      width: 100%;
      padding: 12px 14px;
      border-radius: 11px;
      border: 1.5px solid rgba(74, 14, 46, 0.18);
      background: rgba(255, 255, 255, 0.95);
      color: var(--plum-deep);
      font-family: inherit;
      font-size: 0.94rem;
      font-weight: 500;
    }
    .field-group input:focus {
      outline: none;
      border-color: var(--plum);
      box-shadow: 0 0 0 3px rgba(74, 14, 46, 0.1);
    }
    .toggle-pwd {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--plum-muted);
      font-size: 0.75rem;
      font-weight: 700;
      cursor: pointer;
    }

    .btn-login {
      width: 100%;
      margin-top: 6px;
      padding: 13px 18px;
      border: none;
      border-radius: 11px;
      background: var(--plum);
      color: var(--cream-bg);
      font-family: "Anton", sans-serif;
      font-size: 1.05rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      cursor: pointer;
      transition: transform 0.15s ease, background-color 0.18s ease;
    }
    .btn-login:hover:not(:disabled) {
      background: var(--plum-deep);
      transform: translateY(-1px);
    }
    .btn-login:disabled { opacity: 0.6; cursor: not-allowed; }

    .err-msg {
      color: #b91c1c;
      font-size: 0.82rem;
      font-weight: 600;
      margin-top: 10px;
      min-height: 18px;
      text-align: center;
    }
  </style>
</head>
<body>
  <main class="hero-wrap">
    <h1 class="ed-headline">ELİF ÖĞRETMEN</h1>

    <div class="login-card">
      <form id="login-form">
        <div class="field-group">
          <label for="usr">Kullanıcı Adı</label>
          <div class="field-wrap">
            <input id="usr" type="text" required autocomplete="username" placeholder="Kullanıcı adı" />
          </div>
        </div>
        <div class="field-group">
          <label for="pwd">Parola</label>
          <div class="field-wrap">
            <input id="pwd" type="password" required autocomplete="current-password" placeholder="••••••••" />
            <button type="button" id="btn-toggle-pwd" class="toggle-pwd">Göster</button>
          </div>
        </div>
        <button type="submit" id="btn-submit" class="btn-login">GİRİŞ YAP</button>
        <div id="err" class="err-msg"></div>
      </form>
    </div>
  </main>

  <script>
    const pwdInput = document.getElementById("pwd");
    const toggleBtn = document.getElementById("btn-toggle-pwd");
    toggleBtn.onclick = () => {
      const isPwd = pwdInput.type === "password";
      pwdInput.type = isPwd ? "text" : "password";
      toggleBtn.textContent = isPwd ? "Gizle" : "Göster";
    };

    document.getElementById("login-form").onsubmit = async (e) => {
      e.preventDefault();
      const err = document.getElementById("err");
      const btn = document.getElementById("btn-submit");
      err.textContent = "";
      btn.disabled = true;
      btn.textContent = "GİRİŞ YAPILIYOR...";
      try {
        const res = await fetch("/api/method/login", {
          method: "POST",
          headers: { "Content-Type": "application/json", "Accept": "application/json" },
          body: JSON.stringify({
            usr: document.getElementById("usr").value.trim(),
            pwd: pwdInput.value,
          }),
        });
        const data = await res.json();
        if (res.ok && (data.message === "Logged In" || data.message === "No App" || data.home_page)) {
          window.location.href = "/odev";
          return;
        }
        err.textContent = "Kullanıcı adı veya parola hatalı.";
      } catch (ex) {
        err.textContent = "Bağlantı hatası, tekrar deneyin.";
      }
      btn.disabled = false;
      btn.textContent = "GİRİŞ YAP";
    };
  </script>
</body>
</html>
